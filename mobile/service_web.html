<!doctype html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="title" content="퀀트" />
    <meta name="author" content="" />
    <title>퀀트</title>
    <style>
      .qbot-service-web,
      .qbot-service-web div,
      .qbot-service-web p {
        margin: 0;
        padding: 0;
      }

      .qbot-service-web {
        width: 800px;
        max-width: 100%;
        background: #fff;
        color: #111;
      }

      .qbot-service-web img {
        display: block;
        max-width: 100%;
        border: 0;
      }

      .qbot-service-web__content {
        width: 750px;
        max-width: calc(100% - 50px);
        margin-left: 25px;
      }

      .qbot-service-web__spacer {
        margin-top: 20px;
      }
    </style>
  </head>
  <body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
    <div class="qbot-service-web">
      <input type="hidden" id="pms_code" name="pms_code" value="" /><input type="hidden" id="snCust" name="snCust" value="" />

      <div class="qbot-service-web__wrapper">
        <div class="qbot-service-web__popcon">
          <p>
            <img
              src="img/service_web/pop_top.jpg"
              alt="시대의 흐름! 퀀트 서비스. 금융공학을 이용한 퀀트 포트폴리오. 퀀트는 과학적 계량분석을 통해 추천 포트폴리오를 구성하는 시스템 트레이딩 전략으로, 전 종목 정보를 실시간으로 수집/계량 분석하여 명확한 매매 타이밍을 제공합니다. 또한 포트폴리오의 보유내역, 과거 매매내역, 월별 수익률 현황 등 포트폴리오의 성과를 모두 공개합니다."
            />
          </p>
          <div class="qbot-service-web__content">
            <p><img src="img/service_web/pop2_img1.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img2.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img3.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img4.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img5.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img6.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img7.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img8.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img9.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img10.jpg" alt="" /></p>
            <p><img src="img/service_web/pop2_img11.jpg" alt="" /></p>
            <p class="qbot-service-web__spacer">
              <img src="img/service_web/pop2_img7.gif" alt="서비스 무료 제공. 최초 서비스 가입 시 7일간 무료 서비스를 제공하며, 이때 적용되는 수수료는 정상 주식 매매수수료율인 0.015%가 적용됩니다." />
